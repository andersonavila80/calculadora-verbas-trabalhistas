<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Verbas Trabalhistas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.5;
    }

    input, button {
      padding: 10px;
      margin: 5px 0;
      width: 100%;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
    }

    #resultado {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>
  <h1>Calculadora de Verbas Trabalhistas</h1>

  <p>Estimativa simples de algumas verbas trabalhistas.</p>

  <label>Salário mensal:</label>
  <input id="salario" type="number" step="0.01" placeholder="Ex.: 3000">

  <label>Meses trabalhados no ano:</label>
  <input id="meses" type="number" min="1" max="12" placeholder="Ex.: 12">

  <button onclick="calcular()">Calcular estimativa</button>

  <div id="resultado"></div>

  <script>
    function calcular() {
      const salario = Number(document.getElementById("salario").value);
      const meses = Number(document.getElementById("meses").value);

      if (!salario || !meses) {
        document.getElementById("resultado").innerHTML =
          "Informe o salário e a quantidade de meses.";
        return;
      }

      const decimoTerceiro = salario * meses / 12;
      const ferias = salario;
      const terco = ferias / 3;
      const total = decimoTerceiro + ferias + terco;

      document.getElementById("resultado").innerHTML = `
        <strong>Estimativa:</strong><br><br>
        13º proporcional: R$ ${decimoTerceiro.toFixed(2)}<br>
        Férias: R$ ${ferias.toFixed(2)}<br>
        1/3 de férias: R$ ${terco.toFixed(2)}<br><br>
        <strong>Total estimado: R$ ${total.toFixed(2)}</strong>
        <p><small>Esta ferramenta possui finalidade meramente estimativa e não substitui cálculo jurídico ou contábil.</small></p>
      `;
    }
  </script>
</body>
</html>
